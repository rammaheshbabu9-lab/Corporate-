<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>One Million Pixels - Admin</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,Inter,sans-serif;
    background:#f5f7fa;
    color:#111827;
}

header{
    background:#fff;
    border-bottom:1px solid #e5e7eb;
    padding:18px 0;
}

.container{
    width:min(1250px,94%);
    margin:auto;
}

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.brand{
    font-size:21px;
    font-weight:800;
}

.brand span{color:#2563eb}

.refresh{
    border:0;
    background:#111827;
    color:#fff;
    padding:11px 17px;
    border-radius:8px;
    cursor:pointer;
    font-weight:700;
}

h1{
    margin:30px 0 8px;
    font-size:32px;
}

.subtitle{
    color:#6b7280;
    margin-bottom:25px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:20px;
}

.stat strong{
    display:block;
    font-size:28px;
    margin-bottom:5px;
}

.stat span{
    color:#6b7280;
    font-size:13px;
}

.toolbar{
    background:#fff;
    border:1px solid #e5e7eb;
    padding:16px;
    border-radius:12px;
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr;
    gap:12px;
    margin-bottom:20px;
}

input,select,textarea{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    outline:none;
    font:inherit;
    background:#fff;
}

.table-box{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:12px;
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1050px;
}

th,td{
    padding:14px 12px;
    border-bottom:1px solid #edf0f3;
    text-align:left;
    vertical-align:middle;
    font-size:13px;
}

th{
    background:#f9fafb;
    font-size:12px;
    color:#4b5563;
    text-transform:uppercase;
}

.logo{
    width:48px;
    height:48px;
    border:1px solid #e5e7eb;
    border-radius:8px;
    object-fit:contain;
    background:#fff;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:700;
}

.pending{
    background:#fff7ed;
    color:#c2410c;
}

.approved{
    background:#ecfdf5;
    color:#047857;
}

.rejected{
    background:#fef2f2;
    color:#b91c1c;
}

.received{
    background:#ecfdf5;
    color:#047857;
}

.notreceived{
    background:#fef2f2;
    color:#b91c1c;
}

.btn{
    border:0;
    border-radius:7px;
    padding:8px 11px;
    cursor:pointer;
    font-weight:700;
    font-size:12px;
    margin:2px;
}

.view{background:#eef2ff;color:#3730a3}
.edit{background:#f3f4f6;color:#111827}
.approve{background:#dcfce7;color:#166534}
.reject{background:#fee2e2;color:#991b1b}
.payment{background:#dbeafe;color:#1d4ed8}

.empty{
    text-align:center;
    padding:50px;
    color:#6b7280;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:1000;
}

.modal.show{display:flex}

.modal-box{
    width:min(600px,100%);
    max-height:92vh;
    overflow:auto;
    background:#fff;
    border-radius:15px;
    padding:25px;
    position:relative;
}

.close{
    position:absolute;
    right:15px;
    top:15px;
    border:0;
    width:34px;
    height:34px;
    border-radius:50%;
    background:#f3f4f6;
    cursor:pointer;
    font-size:18px;
}

.modal h2{
    margin-bottom:20px;
}

.field{
    margin-bottom:14px;
}

.field label{
    display:block;
    font-size:12px;
    font-weight:700;
    margin-bottom:6px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.full{
    grid-column:1/-1;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:20px;
}

.save{
    border:0;
    background:#2563eb;
    color:#fff;
    padding:11px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:700;
}

.cancel{
    border:0;
    background:#e5e7eb;
    padding:11px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:700;
}

.detail-logo{
    width:100px;
    height:100px;
    object-fit:contain;
    border:1px solid #e5e7eb;
    border-radius:12px;
    margin-bottom:15px;
}

.detail{
    border-bottom:1px solid #eee;
    padding:11px 0;
}

.detail strong{
    display:block;
    color:#6b7280;
    font-size:11px;
    margin-bottom:3px;
}

.message{
    display:none;
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
    font-weight:600;
    font-size:13px;
}

.message.show{display:block}
.success{background:#ecfdf5;color:#047857}
.error{background:#fef2f2;color:#b91c1c}

@media(max-width:850px){
    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .toolbar{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:550px){
    .stats{
        grid-template-columns:1fr 1fr;
    }

    .toolbar{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }
}
</style>
</head>

<body>

<header>
<div class="container header">
    <div class="brand">
        ONE MILLION <span>PIXELS</span> — ADMIN
    </div>

    <button class="refresh" onclick="loadBusinesses()">
        ↻ Refresh
    </button>
</div>
</header>

<main class="container">

<h1>Business Management</h1>

<p class="subtitle">
    Review registrations, verify payments and manage pixel bookings.
</p>

<div id="message" class="message"></div>

<div class="stats">

    <div class="stat">
        <strong id="totalCount">0</strong>
        <span>Total Registrations</span>
    </div>

    <div class="stat">
        <strong id="pendingCount">0</strong>
        <span>Pending</span>
    </div>

    <div class="stat">
        <strong id="approvedCount">0</strong>
        <span>Approved</span>
    </div>

    <div class="stat">
        <strong id="rejectedCount">0</strong>
        <span>Rejected</span>
    </div>

</div>

<div class="toolbar">

    <input
        id="search"
        placeholder="Search company, mobile, block..."
        oninput="renderTable()"
    >

    <select id="statusFilter" onchange="renderTable()">
        <option value="">All Status</option>
        <option value="pending">Pending</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
    </select>

    <select id="paymentFilter" onchange="renderTable()">
        <option value="">All Payments</option>
        <option value="pending">Payment Pending</option>
        <option value="received">Payment Received</option>
        <option value="not_received">Not Received</option>
    </select>

    <select id="sectorFilter" onchange="renderTable()">
        <option value="">All Sectors</option>
    </select>

</div>

<div class="table-box">

<table>

<thead>
<tr>
    <th>Logo</th>
    <th>Company</th>
    <th>Contact</th>
    <th>Sector</th>
    <th>Block</th>
    <th>Price</th>
    <th>Approval</th>
    <th>Payment</th>
    <th>Actions</th>
</tr>
</thead>

<tbody id="businessTable">
</tbody>

</table>

</div>

</main>


<!-- VIEW MODAL -->

<div id="viewModal" class="modal">

<div class="modal-box">

<button class="close" onclick="closeModal('viewModal')">×</button>

<div id="viewContent"></div>

</div>

</div>


<!-- EDIT MODAL -->

<div id="editModal" class="modal">

<div class="modal-box">

<button class="close" onclick="closeModal('editModal')">×</button>

<h2>Edit Business</h2>

<form id="editForm">

<input type="hidden" id="editId">

<div class="form-grid">

<div class="field">
<label>Company / Brand Name</label>
<input id="editCompany" required>
</div>

<div class="field">
<label>Contact Person</label>
<input id="editContact">
</div>

<div class="field">
<label>Mobile</label>
<input id="editMobile">
</div>

<div class="field">
<label>Website</label>
<input id="editWebsite">
</div>

<div class="field">
<label>Sector</label>
<select id="editSector">
<option>Banking</option>
<option>IT</option>
<option>Finance</option>
<option>Education</option>
<option>Healthcare</option>
<option>Real Estate</option>
<option>Retail</option>
<option>Food & Restaurant</option>
<option>Travel</option>
<option>Manufacturing</option>
<option>Services</option>
<option>Other</option>
</select>
</div>

<div class="field">
<label>Block Number</label>
<input id="editBlock" type="number" min="1" max="1000">
</div>

<div class="field full">
<label>Description</label>
<textarea id="editDescription" rows="4"></textarea>
</div>

</div>

<div class="modal-actions">

<button
type="button"
class="cancel"
onclick="closeModal('editModal')">
Cancel
</button>

<button
type="submit"
class="save">
Save Changes
</button>

</div>

</form>

</div>

</div>


<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
"https://eaowxilhfzyukzetgqxo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Z3xsADypaOjX8GEQEOLUdg_vbxynHRx";

const API_URL =
SUPABASE_URL + "/rest/v1/businesses";

let businesses = [];


/* =====================================================
   HEADERS
===================================================== */

function apiHeaders(){

    return {
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer " + SUPABASE_KEY,
        "Content-Type":"application/json"
    };

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value){

    return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type){

    const box =
        document.getElementById("message");

    box.className =
        "message show " + type;

    box.textContent = text;

    setTimeout(()=>{
        box.className="message";
    },4000);

}


/* =====================================================
   LOAD ALL DATA
===================================================== */

async function loadBusinesses(){

    const table =
        document.getElementById("businessTable");

    table.innerHTML = `
        <tr>
            <td colspan="9" class="empty">
                Loading businesses...
            </td>
        </tr>
    `;

    try{

        /*
         * IMPORTANT:
         * Admin prototype uses anon SELECT.
         */
        const response =
            await fetch(
                API_URL +
                "?select=*&order=created_at.desc",
                {
                    method:"GET",
                    headers:apiHeaders()
                }
            );

        if(!response.ok){

            const error =
                await response.text();

            throw new Error(error);
        }

        businesses =
            await response.json();

        updateStats();
        populateSectors();
        renderTable();

    }catch(error){

        console.error(error);

        table.innerHTML = `
            <tr>
                <td colspan="9" class="empty">
                    Unable to load data.<br><br>
                    ${escapeHtml(error.message)}
                </td>
            </tr>
        `;

        showMessage(
            "Failed to load businesses. Check Supabase RLS policies.",
            "error"
        );
    }

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

    document.getElementById("totalCount")
        .textContent = businesses.length;

    document.getElementById("pendingCount")
        .textContent =
        businesses.filter(
            b => b.approval_status === "pending"
        ).length;

    document.getElementById("approvedCount")
        .textContent =
        businesses.filter(
            b => b.approval_status === "approved"
        ).length;

    document.getElementById("rejectedCount")
        .textContent =
        businesses.filter(
            b => b.approval_status === "rejected"
        ).length;

}


/* =====================================================
   SECTORS
===================================================== */

function populateSectors(){

    const select =
        document.getElementById("sectorFilter");

    const sectors =
        [...new Set(
            businesses
            .map(b => b.sector)
            .filter(Boolean)
        )].sort();

    select.innerHTML =
        `<option value="">All Sectors</option>`;

    sectors.forEach(sector=>{

        const option =
            document.createElement("option");

        option.value = sector;
        option.textContent = sector;

        select.appendChild(option);

    });

}


/* =====================================================
   FILTER + TABLE
===================================================== */

function renderTable(){

    const search =
        document.getElementById("search")
        .value
        .trim()
        .toLowerCase();

    const status =
        document.getElementById("statusFilter")
        .value;

    const payment =
        document.getElementById("paymentFilter")
        .value;

    const sector =
        document.getElementById("sectorFilter")
        .value;

    const filtered =
        businesses.filter(b=>{

            const text =
                (
                    (b.company_name || "") +
                    " " +
                    (b.mobile || "") +
                    " " +
                    (b.contact_person || "") +
                    " " +
                    (b.block_number || "")
                ).toLowerCase();

            return (
                (!search || text.includes(search)) &&
                (!status ||
                    b.approval_status === status) &&
                (!payment ||
                    b.payment_status === payment) &&
                (!sector ||
                    b.sector === sector)
            );

        });

    const tbody =
        document.getElementById("businessTable");

    if(!filtered.length){

        tbody.innerHTML = `
            <tr>
                <td colspan="9" class="empty">
                    No businesses found.
                </td>
            </tr>
        `;

        return;
    }

    tbody.innerHTML =
        filtered.map(b=>{

            const logo =
                b.logo_url
                ? `
                    <img
                    class="logo"
                    src="${escapeHtml(b.logo_url)}"
                    alt="logo">
                  `
                : "—";

            return `
            <tr>

                <td>${logo}</td>

                <td>
                    <strong>
                        ${escapeHtml(b.company_name)}
                    </strong>
                </td>

                <td>
                    ${escapeHtml(b.contact_person || "-")}
                    <br>
                    <small>
                        ${escapeHtml(b.mobile || "-")}
                    </small>
                </td>

                <td>
                    ${escapeHtml(b.sector || "-")}
                </td>

                <td>
                    #${escapeHtml(b.block_number || "-")}
                </td>

                <td>
                    ₹${escapeHtml(b.price || "0")}
                </td>

                <td>
                    ${approvalBadge(b.approval_status)}
                </td>

                <td>
                    ${paymentBadge(b.payment_status)}
                </td>

                <td>

                    <button
                        class="btn view"
                        onclick="viewBusiness(${b.id})">
                        View
                    </button>

                    <button
                        class="btn edit"
                        onclick="editBusiness(${b.id})">
                        Edit
                    </button>

                    ${
                        b.payment_status !== "received"
                        ? `
                        <button
                            class="btn payment"
                            onclick="paymentReceived(${b.id})">
                            Payment Received
                        </button>
                        `
                        : ""
                    }

                    ${
                        b.approval_status !== "approved"
                        ? `
                        <button
                            class="btn approve"
                            onclick="approveBusiness(${b.id})">
                            Approve
                        </button>
                        `
                        : ""
                    }

                    ${
                        b.approval_status !== "rejected"
                        ? `
                        <button
                            class="btn reject"
                            onclick="rejectBusiness(${b.id})">
                            Reject
                        </button>
                        `
                        : ""
                    }

                </td>

            </tr>
            `;

        }).join("");

}


/* =====================================================
   BADGES
===================================================== */

function approvalBadge(status){

    if(status === "approved")
        return `<span class="badge approved">APPROVED</span>`;

    if(status === "rejected")
        return `<span class="badge rejected">REJECTED</span>`;

    return `<span class="badge pending">PENDING</span>`;
}


function paymentBadge(status){

    if(status === "received")
        return `<span class="badge received">RECEIVED</span>`;

    if(status === "not_received")
        return `<span class="badge notreceived">NOT RECEIVED</span>`;

    return `<span class="badge pending">PENDING</span>`;
}


/* =====================================================
   FIND BUSINESS
===================================================== */

function findBusiness(id){

    return businesses.find(
        b => Number(b.id) === Number(id)
    );

}


/* =====================================================
   VIEW
===================================================== */

function viewBusiness(id){

    const b =
        findBusiness(id);

    if(!b) return;

    const logo =
        b.logo_url
        ? `
        <img
        src="${escapeHtml(b.logo_url)}"
        class="detail-logo">
        `
        : "";

    document.getElementById("viewContent")
    .innerHTML = `

        <div style="text-align:center">
            ${logo}

            <h2>
                ${escapeHtml(b.company_name)}
            </h2>

            <div style="margin-top:7px">
                ${approvalBadge(b.approval_status)}
                ${paymentBadge(b.payment_status)}
            </div>
        </div>

        <div class="detail">
            <strong>Block Number</strong>
            #${escapeHtml(b.block_number)}
        </div>

        <div class="detail">
            <strong>Pixel Count</strong>
            ${escapeHtml(b.pixel_count || 100)} Pixels
        </div>

        <div class="detail">
            <strong>Price</strong>
            ₹${escapeHtml(b.price)}
        </div>

        <div class="detail">
            <strong>Contact Person</strong>
            ${escapeHtml(b.contact_person)}
        </div>

        <div class="detail">
            <strong>Mobile</strong>
            ${escapeHtml(b.mobile)}
        </div>

        <div class="detail">
            <strong>Website</strong>
            ${escapeHtml(b.website || "-")}
        </div>

        <div class="detail">
            <strong>Sector</strong>
            ${escapeHtml(b.sector)}
        </div>

        <div class="detail">
            <strong>Description</strong>
            ${escapeHtml(b.description || "-")}
        </div>

        <div class="detail">
            <strong>Created</strong>
            ${b.created_at
                ? new Date(b.created_at)
                    .toLocaleString("en-IN")
                : "-"
            }
        </div>

    `;

    document
        .getElementById("viewModal")
        .classList.add("show");

}


/* =====================================================
   EDIT
===================================================== */

function editBusiness(id){

    const b =
        findBusiness(id);

    if(!b) return;

    document.getElementById("editId").value =
        b.id;

    document.getElementById("editCompany").value =
        b.company_name || "";

    document.getElementById("editContact").value =
        b.contact_person || "";

    document.getElementById("editMobile").value =
        b.mobile || "";

    document.getElementById("editWebsite").value =
        b.website || "";

    document.getElementById("editSector").value =
        b.sector || "Other";

    document.getElementById("editBlock").value =
        b.block_number || "";

    document.getElementById("editDescription").value =
        b.description || "";

    document
        .getElementById("editModal")
        .classList.add("show");

}


/* =====================================================
   SAVE EDIT
===================================================== */

document
.getElementById("editForm")
.addEventListener(
"submit",
async function(e){

    e.preventDefault();

    const id =
        document.getElementById("editId").value;

    const payload = {

        company_name:
            document.getElementById("editCompany").value.trim(),

        contact_person:
            document.getElementById("editContact").value.trim(),

        mobile:
            document.getElementById("editMobile").value.trim(),

        website:
            document.getElementById("editWebsite").value.trim(),

        sector:
            document.getElementById("editSector").value,

        block_number:
            Number(
                document.getElementById("editBlock").value
            ),

        description:
            document.getElementById("editDescription").value.trim()

    };

    try{

        const response =
            await fetch(
                API_URL +
                "?id=eq." +
                encodeURIComponent(id),
                {
                    method:"PATCH",
                    headers:apiHeaders({
                        "Prefer":"return=representation"
                    }),
                    body:JSON.stringify(payload)
                }
            );

        if(!response.ok){

            const error =
                await response.text();

            throw new Error(error);
        }

        closeModal("editModal");

        showMessage(
            "Business updated successfully.",
            "success"
        );

        await loadBusinesses();

    }catch(error){

        console.error(error);

        showMessage(
            "Edit failed: " + error.message,
            "error"
        );

    }

});


/* =====================================================
   PAYMENT RECEIVED
===================================================== */

async function paymentReceived(id){

    const b =
        findBusiness(id);

    if(!b) return;

    const ok =
        confirm(
            "Confirm that payment has been manually verified for " +
            b.company_name +
            "?"
        );

    if(!ok) return;

    await updateBusiness(
        id,
        {
            payment_status:"received"
        },
        "Payment marked as received."
    );

}


/* =====================================================
   APPROVE
===================================================== */

async function approveBusiness(id){

    const b =
        findBusiness(id);

    if(!b) return;

    if(
        b.payment_status !== "received"
    ){

        const confirmWithoutPayment =
            confirm(
                "Payment is not marked as received. Approve anyway?"
            );

        if(!confirmWithoutPayment)
            return;
    }

    const ok =
        confirm(
            "Approve " +
            b.company_name +
            "?\n\nThis will make the business LIVE on the public website."
        );

    if(!ok) return;

    await updateBusiness(
        id,
        {
            approval_status:"approved",
            booking_status:"sold"
        },
        "Business approved successfully."
    );

}


/* =====================================================
   REJECT
===================================================== */

async function rejectBusiness(id){

    const b =
        findBusiness(id);

    if(!b) return;

    const ok =
        confirm(
            "Reject " +
            b.company_name +
            "?"
        );

    if(!ok) return;

    await updateBusiness(
        id,
        {
            approval_status:"rejected",
            booking_status:"available",
            payment_status:"not_received"
        },
        "Business rejected successfully."
    );

}


/* =====================================================
   UPDATE DATABASE
===================================================== */

async function updateBusiness(
    id,
    changes,
    successText
){

    try{

        const response =
            await fetch(
                API_URL +
                "?id=eq." +
                encodeURIComponent(id),
                {
                    method:"PATCH",
                    headers:apiHeaders({
                        "Prefer":"return=representation"
                    }),
                    body:JSON.stringify(changes)
                }
            );

        if(!response.ok){

            const error =
                await response.text();

            throw new Error(error);
        }

        showMessage(
            successText,
            "success"
        );

        await loadBusinesses();

    }catch(error){

        console.error(error);

        showMessage(
            "Update failed: " +
            error.message,
            "error"
        );
    }

}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeModal(id){

    document
        .getElementById(id)
        .classList.remove("show");

}

window.addEventListener(
"click",
function(e){

    if(
        e.target.classList.contains("modal")
    ){
        e.target.classList.remove("show");
    }

});


/* =====================================================
   INITIAL LOAD
===================================================== */

document.addEventListener(
"DOMContentLoaded",
function(){

    loadBusinesses();

});

</script>
